  finalize_agg:
    name: "30 - Finalize Agg"
    needs: finalize_pb_hierarchical
    if: always() && !cancelled() && (inputs.force_stage == 'finalize_agg' || (inputs.force_stage == '' && (needs.finalize_pb_hierarchical.result == 'success' || needs.finalize_pb_hierarchical.result == 'skipped')))
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: finalize_agg
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  release:
    name: "31 - Release"
    needs: finalize_agg
    if: always() && !cancelled() && (inputs.force_stage == 'release' || (inputs.force_stage == '' && (needs.finalize_agg.result == 'success' || needs.finalize_agg.result == 'skipped')))
    uses: ./.github/workflows/release.yml
    with:
      version: ""
    secrets: inherit
