      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  finalize_pb_dixon_coles:
    name: "23 - Finalize PB Dixon"
    needs: finalize_pb_poisson
    if: always() && !cancelled() && (inputs.force_stage == 'finalize_pb_dixon_coles' || (inputs.force_stage == '' && (needs.finalize_pb_poisson.result == 'success' || needs.finalize_pb_poisson.result == 'skipped')))
