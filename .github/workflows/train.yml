name: GOANGEL Sequential

on:
  workflow_dispatch:
    inputs:
      seasons_lookback: {default: "3", type: string}
      enrich_xg: {default: "true", type: string}
      workers_per_key: {default: "4", type: string}
      max_workers: {default: "256", type: string}
      rate_limit_per_minute: {default: "20", type: string}
      max_attempts_per_model: {default: "15", type: string}
      force_stage: {default: "", type: string}
      is_retry: {default: "false", type: string}

permissions:
  contents: write
  actions: write

concurrency:
  group: goangel-sequential
  cancel-in-progress: false

jobs:
  prepare:
    name: "01 - prepare"
    needs: []
    if: |
      always() && !cancelled() &&
      (inputs.force_stage == '' || inputs.force_stage == 'prepare')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: prepare
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  refresh:
    name: "01b - refresh"
    needs: prepare
    if: |
      always() && !cancelled() &&
      needs.prepare.result == 'success' &&
      (inputs.force_stage == '' || inputs.force_stage == 'refresh')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: refresh
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_xgb:
    name: "03 - train_xgb"
    needs: refresh
    if: |
      always() && !cancelled() &&
      needs.refresh.result == 'success' &&
      (inputs.force_stage == '' || inputs.force_stage == 'train_xgb')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: train_xgb
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_lgbm:
    name: "04 - train_lgbm"
    needs: train_xgb
    if: |
      always() && !cancelled() &&
      needs.train_xgb.result == 'success' &&
      (inputs.force_stage == '' || inputs.force_stage == 'train_lgbm')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: train_lgbm
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_catboost:
    name: "05 - train_catboost"
    needs: train_lgbm
    if: |
      always() && !cancelled() &&
      needs.train_lgbm.result == 'success' &&
      (inputs.force_stage == '' || inputs.force_stage == 'train_catboost')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: train_catboost
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_rf:
    name: "06 - train_rf"
    needs: train_catboost
    if: |
      always() && !cancelled() &&
      needs.train_catboost.result == 'success' &&
      (inputs.force_stage == '' || inputs.force_stage == 'train_rf')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: train_rf
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_dl:
    name: "07 - train_dl"
    needs: train_rf
    if: |
