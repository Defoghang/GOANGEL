      is_retry: ${{ inputs.is_retry }}
    secrets: inherit
  finalize_pb_hierarchical:
    name: "15n - finalize_pb_hierarchical"
    needs: finalize_pb_bayesian
    if: |
      always() && !cancelled() &&
      needs.finalize_pb_bayesian.result != 'failure' &&
      needs.finalize_pb_bayesian.result != 'cancelled' &&
      (inputs.force_stage == '' || inputs.force_stage == 'finalize_pb_hierarchical')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: finalize_pb_hierarchical
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit
  finalize_agg:
    name: "15o - finalize_agg"
    needs: finalize_pb_hierarchical
    if: |
      always() && !cancelled() &&
      needs.finalize_pb_hierarchical.result != 'failure' &&
      needs.finalize_pb_hierarchical.result != 'cancelled' &&
      (inputs.force_stage == '' || inputs.force_stage == 'finalize_agg')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: finalize_agg
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  release:
    name: "16 - Release"
    needs: finalize_agg
    if: |
      always() && !cancelled() &&
      inputs.force_stage == '' &&
      needs.finalize_agg.result == 'success'
    uses: ./.github/workflows/release.yml
    with:
      version: ""
    secrets: inherit

  release:
    name: "16 - Release"
    needs: finalize
    if: |
      always() && !cancelled() &&
      inputs.force_stage == '' &&
      needs.finalize.result == 'success'
    uses: ./.github/workflows/release.yml
    with:
      version: ""
    secrets: inherit
