name: GOANGEL Sequential

on:
  workflow_dispatch:
    inputs:
      seasons_lookback:
        default: "3"
        type: string
      enrich_xg:
        default: "true"
        type: string
      workers_per_key:
        default: "4"
        type: string
      max_workers:
        default: "256"
        type: string
      rate_limit_per_minute:
        default: "20"
        type: string
      max_attempts_per_model:
        default: "15"
        type: string
      force_stage:
        default: ""
        type: string
      is_retry:
        default: "false"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: goangel-sequential
  cancel-in-progress: false

jobs:
  prepare:
    name: "01 - Prepare"
    if: inputs.force_stage == '' || inputs.force_stage == 'prepare'
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: prepare
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  refresh_data:
    name: "01b - Refresh Data"
    needs: prepare
    if: |
      always() && !cancelled() &&
      needs.prepare.result != 'failure' &&
      needs.prepare.result != 'cancelled' &&
      (inputs.force_stage == '' || inputs.force_stage == 'refresh')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: refresh
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_xgb:
    name: "02 - XGBoost"
    needs: refresh_data
    if: |
      always() && !cancelled() &&
      needs.refresh_data.result != 'failure' &&
      needs.refresh_data.result != 'cancelled' &&
      (inputs.force_stage == '' || inputs.force_stage == 'train_xgb')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: train_xgb
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_lgbm:
    name: "03 - LightGBM"
    needs: train_xgb
    if: |
      always() && !cancelled() &&
      needs.train_xgb.result != 'failure' &&
      needs.train_xgb.result != 'cancelled' &&
      (inputs.force_stage == '' || inputs.force_stage == 'train_lgbm')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: train_lgbm
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_catboost:
    name: "04 - CatBoost"
    needs: train_lgbm
    if: |
      always() && !cancelled() &&
      needs.train_lgbm.result != 'failure' &&
      needs.train_lgbm.result != 'cancelled' &&
      (inputs.force_stage == '' || inputs.force_stage == 'train_catboost')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: train_catboost
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_rf:
    name: "05 - Random Forest"
    needs: train_catboost
    if: |
      always() && !cancelled() &&
      needs.train_catboost.result != 'failure' &&
      needs.train_catboost.result != 'cancelled' &&
      (inputs.force_stage == '' || inputs.force_stage == 'train_rf')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: train_rf
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_dl:
    name: "06 - Deep Learning"
    needs: train_rf
    if: |
      always() && !cancelled() &&
      needs.train_rf.result != 'failure' &&
      needs.train_rf.result != 'cancelled' &&
      (inputs.force_stage == '' || inputs.force_stage == 'train_dl')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: train_dl
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_pb_poisson:
    name: "07 - PB Poisson"
    needs: train_dl
    if: |
      always() && !cancelled() &&
      needs.train_dl.result != 'failure' &&
      needs.train_dl.result != 'cancelled' &&
      (inputs.force_stage == '' || inputs.force_stage == 'train_pb_poisson')
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: train_pb_poisson
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_pb_dixon_coles:
    name: "08 - PB Dixon-Coles"
    needs: train_pb_poisson
    if: |
      always() && !cancelled() &&
      needs.train_pb_poisson.result != 'failure' &&
      needs.train_pb_poisson.result != 'cancelled' &&
      (inputs.force_stage == '' || inputs.force_stage == 'train_pb_dixon_coles')
    uses: ./.github/workflows/_stage_runner.yml
    with:
