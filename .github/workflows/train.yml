    needs: finalize_dl
    if: always() && !cancelled() && (inputs.force_stage == 'finalize_pb_poisson' || (inputs.force_stage == '' && (needs.finalize_dl.result == 'success' || needs.finalize_dl.result == 'skipped')))
    uses: ./.github/workflows/_stage_runner.yml
