    needs: finalize_pb_bayesian
    if: always() && !cancelled() && (inputs.force_stage == 'finalize_pb_hierarchical' || (inputs.force_stage == '' && (needs.finalize_pb_bayesian.result == 'success' || needs.finalize_pb_bayesian.result == 'skipped')))
