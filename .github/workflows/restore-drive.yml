name: Restore Drive from LFS

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -sS https://rclone.org/install.sh | sudo bash >/dev/null 2>&1

      - name: Setup rclone config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          echo "${RCLONE_CONFIG}" | base64 -d > /tmp/rclone.conf
          chmod 600 /tmp/rclone.conf

      - name: Clone cache-auto with LFS
        run: |
          export GIT_LFS_SKIP_SMUDGE=0
          git lfs install --local >/dev/null 2>&1 || true
          git clone --branch cache-auto \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            /tmp/cache-auto 2>&1 | tail -3

      - name: Restore LFS blobs from refs
        run: |
          cd /tmp/cache-auto
          export GIT_LFS_SKIP_SMUDGE=0
          git lfs fetch --all 2>&1 | tail -3 || true
          git lfs checkout 2>&1 | tail -3 || true
          git lfs pull origin cache-auto 2>&1 | tail -3 || true

          echo "── Contenu :"
          find . -name "*.pkl" -size +1k -exec ls -lh {} \; 2>/dev/null | head -20

      - name: Upload LFS blobs to Drive
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          echo "${RCLONE_CONFIG}" | base64 -d > /tmp/rclone.conf
          chmod 600 /tmp/rclone.conf

          cd /tmp/cache-auto

          echo "── Upload cache complet vers Drive ──"
          rclone --config /tmp/rclone.conf copy cache/ gdrive:GOANGEL/cache/ \
            --transfers 8 --checkers 16 \
            --exclude "*.tmp" --exclude "*.log" \
            --stats-one-line --stats 10s 2>&1 | tail -5

          echo ""
          echo "── Vérification Drive ──"
          rclone --config /tmp/rclone.conf size gdrive:GOANGEL/cache/
          rclone --config /tmp/rclone.conf lsf gdrive:GOANGEL/cache/ | head -20
