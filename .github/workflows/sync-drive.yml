name: GOANGEL Drive Sync

on:
  workflow_dispatch:
    inputs:
      action:
        description: "sync-upload | sync-download"
        required: true
        default: "sync-upload"
        type: choice
        options:
          - sync-upload
          - sync-download
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip -q
          pip install -q google-auth google-auth-httplib2 google-api-python-client

      - name: Verify secrets
        env:
          CREDS: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          FOLDER: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "${CREDS}" ]; then
            echo "::error::GDRIVE_CREDENTIALS_JSON manquant"
            exit 1
          fi
          if [ -z "${FOLDER}" ]; then
            echo "::error::GDRIVE_FOLDER_ID manquant"
            exit 1
          fi

      - name: Clone cache-auto
        run: |
          git clone --depth 1 --branch cache-auto \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            /tmp/cache-auto 2>/dev/null || true
          if [ -d /tmp/cache-auto ]; then
            cd /tmp/cache-auto
            git lfs install --local --skip-repo 2>/dev/null || true
            git lfs fetch --all 2>&1 | tail -2 || true
            git lfs checkout 2>&1 | tail -2 || true
            git lfs pull 2>&1 | tail -2 || true
          fi

      - name: Build cache ZIP
        run: |
          if [ ! -d /tmp/cache-auto/cache ]; then
            echo "::error::cache-auto introuvable"
            exit 1
          fi
          cd /tmp/cache-auto
          tar -czf /tmp/goangel-cache.tar.gz cache/
          ls -lh /tmp/goangel-cache.tar.gz
          du -sh /tmp/cache-auto/cache/

      - name: Download cache from Drive
        if: inputs.action == 'sync-download'
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python3 gdrive.py download goangel-cache.tar.gz /tmp/goangel-cache-dl.tar.gz

      - name: Upload cache to Drive
        if: inputs.action == 'sync-upload'
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python3 gdrive.py upload /tmp/goangel-cache.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdrive-sync-log-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
          if-no-files-found: ignore
