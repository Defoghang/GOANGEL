name: Restore LFS to Drive

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install rclone
        run: |
          curl -sS https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          rclone version | head -1

      - name: Setup rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          echo "${RCLONE_CONFIG}" | base64 -d > /tmp/rclone.conf
          chmod 600 /tmp/rclone.conf

      - name: Clone cache-auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git lfs install --local 2>/dev/null || git lfs install
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/cache-repo 2>&1 | tail -2
          cd /tmp/cache-repo
          git fetch --all
          git checkout cache-auto 2>&1 | tail -2

      - name: Extract pkl from all commits
        run: |
          cd /tmp/cache-repo
          mkdir -p /tmp/restored

          PATHS="cache/historical.pkl
cache/stages/features.pkl
cache/stages/metadata.pkl
cache/stages/models/ml_XGB.pkl
cache/stages/models/ml_LGBM.pkl
cache/stages/models/ml_CatBoost.pkl
cache/stages/models/ml_RF.pkl
cache/stages/models/ml_DL.pkl
cache/stages/models/pb_PoissonGoalsModel.pkl
cache/stages/models/pb_DixonColesGoalModel.pkl
cache/stages/models/pb_BivariatePoissonGoalModel.pkl
cache/stages/models/pb_NegativeBinomialGoalModel.pkl
cache/stages/models/pb_WeibullCopulaGoalsModel.pkl
cache/stages/models/pb_ZeroInflatedPoissonGoalsModel.pkl"

          echo "$PATHS" | while read -r PATH_ITEM; do
            [ -z "$PATH_ITEM" ] && continue
            echo "── $PATH_ITEM ──"
            LAST_COMMIT=$(git log --all --format=%H -1 -- "$PATH_ITEM" 2>/dev/null)
            if [ -z "$LAST_COMMIT" ]; then
              echo "  ⚠️  Aucun commit"
              continue
            fi
            mkdir -p "/tmp/restored/$(dirname "$PATH_ITEM")"
            git show "${LAST_COMMIT}:${PATH_ITEM}" > "/tmp/restored/${PATH_ITEM}" 2>/dev/null
            SIZE=$(stat -c%s "/tmp/restored/${PATH_ITEM}" 2>/dev/null || echo 0)
            HB=$(head -c 4 "/tmp/restored/${PATH_ITEM}" 2>/dev/null || echo "")
            if [ "$HB" = "vers" ] || [ "$SIZE" -lt 1000 ]; then
              echo "  ⚠️  Pointeur LFS ($SIZE bytes) — extraction OID"
              OID=$(grep -oE 'sha256:[a-f0-9]+' "/tmp/restored/${PATH_ITEM}" | cut -d: -f2 | head -1)
              SZ_PTR=$(grep -oE 'size [0-9]+' "/tmp/restored/${PATH_ITEM}" | awk '{print $2}' | head -1)
              if [ -n "$OID" ]; then
                echo "  OID: $OID"
                echo "$OID" >> /tmp/oids.txt
                rm -f "/tmp/restored/${PATH_ITEM}"
              fi
            else
              echo "  ✅ $SIZE bytes"
            fi
          done

      - name: Download LFS blobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/oids.txt ]; then
            echo "Pas d'OIDs"
            exit 0
          fi
          mkdir -p /tmp/blobs
          sort -u /tmp/oids.txt | while read -r OID; do
            [ -z "$OID" ] && continue
            echo "── $OID ──"
            curl -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.git-lfs+json" \
              -H "Content-Type: application/vnd.git-lfs+json" \
              -d "{\"operation\":\"download\",\"transfers\":[\"basic\"],\"objects\":[{\"oid\":\"${OID}\"}]}" \
              "https://github.com/${{ github.repository }}.git/info/lfs/objects/batch" > "/tmp/batch_${OID}.json" 2>/dev/null

            HREF=$(python3 -c "
import json
try:
    d = json.load(open('/tmp/batch_${OID}.json'))
    for o in d.get('objects', []):
        a = o.get('actions', {})
        if 'download' in a:
            print(a['download']['href'])
            break
except Exception:
    pass
")
            if [ -n "$HREF" ]; then
              echo "  ✅ URL obtenue"
              curl -sS -L -o "/tmp/blobs/${OID}" "$HREF" 2>/dev/null
              SZ=$(stat -c%s "/tmp/blobs/${OID}" 2>/dev/null || echo 0)
              echo "  Taille : $SZ bytes"
            else
              echo "  ❌ Pas d'URL"
            fi
          done

      - name: Reconstruct files
        run: |
          cd /tmp/cache-repo
          for OID_FILE in /tmp/blobs/*; do
            [ ! -f "$OID_FILE" ] && continue
            OID=$(basename "$OID_FILE")
            echo "── Reconstruction OID $OID ──"
            for PATH_ITEM in \
              "cache/historical.pkl" \
              "cache/stages/features.pkl" \
              "cache/stages/metadata.pkl" \
              "cache/stages/models/ml_XGB.pkl" \
              "cache/stages/models/ml_LGBM.pkl" \
              "cache/stages/models/ml_CatBoost.pkl" \
              "cache/stages/models/ml_RF.pkl" \
              "cache/stages/models/ml_DL.pkl" \
              "cache/stages/models/pb_PoissonGoalsModel.pkl" \
              "cache/stages/models/pb_DixonColesGoalModel.pkl" \
              "cache/stages/models/pb_BivariatePoissonGoalModel.pkl" \
              "cache/stages/models/pb_NegativeBinomialGoalModel.pkl" \
              "cache/stages/models/pb_WeibullCopulaGoalsModel.pkl" \
              "cache/stages/models/pb_ZeroInflatedPoissonGoalsModel.pkl"; do
              LAST_COMMIT=$(git log --all --format=%H -1 -- "$PATH_ITEM" 2>/dev/null)
              [ -z "$LAST_COMMIT" ] && continue
              TMP_PTR="/tmp/ptr_check.txt"
              git show "${LAST_COMMIT}:${PATH_ITEM}" > "$TMP_PTR" 2>/dev/null
              PT_OID=$(grep -oE 'sha256:[a-f0-9]+' "$TMP_PTR" | cut -d: -f2 | head -1)
              if [ "$PT_OID" = "$OID" ]; then
                mkdir -p "/tmp/restored/$(dirname "$PATH_ITEM")"
                cp "$OID_FILE" "/tmp/restored/${PATH_ITEM}"
                echo "  ✅ $PATH_ITEM reconstruit"
                break
              fi
            done
          done

          echo ""
          echo "── Contenu restauré final ──"
          find /tmp/restored -name "*.pkl" -exec ls -lh {} \; 2>/dev/null | head -30

      - name: Upload to Drive
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          echo "${RCLONE_CONFIG}" | base64 -d > /tmp/rclone.conf
          chmod 600 /tmp/rclone.conf

          if [ ! -d /tmp/restored/cache ]; then
            echo "⚠️  Rien à uploader"
            exit 0
          fi

          echo "── Upload vers Drive ──"
          rclone --config /tmp/rclone.conf copy /tmp/restored/cache/ gdrive:GOANGEL/cache/ \
            --transfers 8 --checkers 16 \
            --stats-one-line --stats 10s 2>&1 | tail -5

          echo ""
          echo "── Taille finale Drive ──"
          rclone --config /tmp/rclone.conf size gdrive:GOANGEL/cache/
