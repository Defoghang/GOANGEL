name: Restore Cache

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -sS https://rclone.org/install.sh | sudo bash >/dev/null 2>&1

      - name: Setup rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          echo "${RCLONE_CONFIG}" | base64 -d > /tmp/rclone.conf
          chmod 600 /tmp/rclone.conf

      - name: Clone and fetch LFS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git lfs install 2>/dev/null || true
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/cache-repo 2>&1 | tail -2
          cd /tmp/cache-repo
          git fetch --all --tags 2>&1 | tail -3
          git checkout cache-auto 2>&1 | tail -2
          git lfs fetch --all 2>&1 | tail -3
          git lfs checkout 2>&1 | tail -3

      - name: Restore pkl files
        run: |
          cd /tmp/cache-repo
          mkdir -p /tmp/restored
          for P in \
            cache/historical.pkl \
            cache/stages/features.pkl \
            cache/stages/metadata.pkl \
            cache/stages/models/ml_XGB.pkl \
            cache/stages/models/ml_LGBM.pkl \
            cache/stages/models/ml_CatBoost.pkl \
            cache/stages/models/ml_RF.pkl \
            cache/stages/models/ml_DL.pkl \
            cache/stages/models/pb_PoissonGoalsModel.pkl \
            cache/stages/models/pb_DixonColesGoalModel.pkl \
            cache/stages/models/pb_BivariatePoissonGoalModel.pkl \
            cache/stages/models/pb_NegativeBinomialGoalModel.pkl \
            cache/stages/models/pb_WeibullCopulaGoalsModel.pkl \
            cache/stages/models/pb_ZeroInflatedPoissonGoalsModel.pkl; do
            C=$(git log --all --format=%H -1 -- "$P" 2>/dev/null)
            if [ -z "$C" ]; then
              echo "SKIP $P"
              continue
            fi
            mkdir -p "/tmp/restored/$(dirname "$P")"
            git show "${C}:${P}" > "/tmp/restored/${P}" 2>/dev/null
            SZ=$(stat -c%s "/tmp/restored/${P}" 2>/dev/null || echo 0)
            HB=$(head -c 4 "/tmp/restored/${P}" 2>/dev/null || echo "")
            if [ "$HB" = "vers" ] || [ "$SZ" -lt 1000 ]; then
              OID=$(grep -oE 'sha256:[a-f0-9]+' "/tmp/restored/${P}" | cut -d: -f2 | head -1)
              echo "LFS $P OID=$OID"
              if [ -n "$OID" ]; then
                mkdir -p /tmp/lfs_files
                cd /tmp/cache-repo
                git lfs pull --include="$P" 2>&1 | tail -1 || true
                if [ -f "/tmp/cache-repo/$P" ]; then
                  SZ2=$(stat -c%s "/tmp/cache-repo/$P" 2>/dev/null || echo 0)
                  if [ "$SZ2" -gt 1000 ]; then
                    cp "/tmp/cache-repo/$P" "/tmp/restored/$P"
                    echo "  OK $P ($SZ2 bytes)"
                  fi
                fi
              fi
            else
              echo "OK $P ($SZ bytes)"
            fi
          done
          echo "── Fichiers restaurés ──"
          find /tmp/restored -name "*.pkl" -exec ls -lh {} \; 2>/dev/null

      - name: Upload to Drive
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          echo "${RCLONE_CONFIG}" | base64 -d > /tmp/rclone.conf
          chmod 600 /tmp/rclone.conf
          if [ -d /tmp/restored/cache ]; then
            rclone --config /tmp/rclone.conf copy /tmp/restored/cache/ gdrive:GOANGEL/cache/ \
              --transfers 8 --checkers 16 \
              --stats-one-line --stats 10s 2>&1 | tail -5
          fi
          echo "── Taille Drive ──"
          rclone --config /tmp/rclone.conf size gdrive:GOANGEL/cache/
